name: Flutter CI

on:
  push:
    branches: [main, feat/mvp-offline-fisio]
  pull_request:
    branches: [main]

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android scaffold when needed
        run: |
          if [ ! -d android ]; then flutter create --platforms=android --project-name=mais_fisio .; fi
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
